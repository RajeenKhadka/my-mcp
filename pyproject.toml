[project]
name = "my-mcp"
version = "0.1.0"
description = "A personal MCP server built with FastMCP"
readme = "README.md"
authors = [
    { name = "RajeenKhadka", email = "rajeenkhadka315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "fastmcp>=4.0.11",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Install the `app` folder as a package so `from app...` works everywhere
[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
